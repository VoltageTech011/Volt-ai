<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Voltage AI Chat</title>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #111827;
      --user-bubble: #2563eb;
      --bot-bubble: #1f2937;
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #3b82f6;
      --border: #1f2937;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .app-container {
      width: 100%;
      max-width: 768px;
      height: 100vh;
      display: flex;
      flex-direction: column;
      background-color: var(--card-bg);
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
    }

    @media (min-width: 768px) {
      .app-container {
        height: 90vh;
        border-radius: 16px;
        border: 1px solid var(--border);
      }
    }

    .chat-header {
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .status-indicator {
      width: 10px;
      height: 10px;
      background-color: #10b981;
      border-radius: 50%;
      box-shadow: 0 0 8px #10b981;
    }

    .chat-header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chat-header h1 span {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .badge {
      background-color: rgba(59, 130, 246, 0.1);
      color: var(--accent);
      border: 1px solid rgba(59, 130, 246, 0.3);
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .chat-box {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      display: flex;
      gap: 12px;
      max-width: 80%;
    }

    .message.user-message {
      align-self: flex-end;
      flex-direction: row-reverse;
    }

    .message.bot-message, .message.system-message {
      align-self: flex-start;
    }

    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.95rem;
      flex-shrink: 0;
      color: var(--text-main);
    }

    .user-message .avatar {
      background-color: var(--user-bubble);
    }

    .bot-message .avatar, .system-message .avatar {
      background-color: #1e1b4b;
      color: #818cf8;
    }

    .bubble {
      padding: 12px 16px;
      border-radius: 16px;
      font-size: 0.95rem;
      line-height: 1.5;
    }

    .user-message .bubble {
      background-color: var(--user-bubble);
      border-top-right-radius: 4px;
    }

    .bot-message .bubble, .system-message .bubble {
      background-color: var(--bot-bubble);
      border-top-left-radius: 4px;
    }

    .input-area {
      padding: 16px 24px;
      border-top: 1px solid var(--border);
    }

    #chatForm {
      display: flex;
      gap: 12px;
    }

    #userInput {
      flex: 1;
      background-color: var(--bg-color);
      border: 1px solid var(--border);
      color: var(--text-main);
      padding: 12px 16px;
      border-radius: 12px;
      outline: none;
      font-size: 0.95rem;
    }

    #userInput:focus {
      border-color: var(--accent);
    }

    #sendBtn {
      background-color: var(--accent);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: opacity 0.2s;
    }

    #sendBtn:hover {
      opacity: 0.9;
    }

    #sendBtn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .typing-indicator span {
      display: inline-block;
      width: 6px;
      height: 6px;
      background-color: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.4s infinite ease-in-out both;
      margin: 0 2px;
    }

    .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
    .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); }
      40% { transform: scale(1); }
    }
  </style>
</head>
<body>
  <div class="app-container">
    <header class="chat-header">
      <div class="logo-container">
        <div class="status-indicator"></div>
        <h1><i class="fa-solid fa-bolt" style="color: #f59e0b;"></i> Voltage <span>v1.0</span></h1>
      </div>
      <span class="badge"><i class="fa-solid fa-microchip"></i> ONNX Engine</span>
    </header>

    <main class="chat-box" id="chatBox">
      <div class="message system-message">
        <div class="avatar"><i class="fa-solid fa-robot"></i></div>
        <div class="bubble">
          Hello! I am <strong>Voltage</strong>, a lightweight Transformer model running natively on Node.js via ONNX Runtime. How can I help you today?
        </div>
      </div>
    </main>

    <footer class="input-area">
      <form id="chatForm">
        <input 
          type="text" 
          id="userInput" 
          placeholder="Type a message..." 
          autocomplete="off" 
          required 
        />
        <button type="submit" id="sendBtn">
          <span>Send</span>
          <i class="fa-solid fa-paper-plane"></i>
        </button>
      </form>
    </footer>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const chatForm = document.getElementById('chatForm');
      const userInput = document.getElementById('userInput');
      const chatBox = document.getElementById('chatBox');
      const sendBtn = document.getElementById('sendBtn');

      function appendMessage(sender, text, isSystem = false) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message');
        
        if (isSystem) {
          msgDiv.classList.add('system-message');
        } else {
          msgDiv.classList.add(sender === 'user' ? 'user-message' : 'bot-message');
        }

        const avatar = document.createElement('div');
        avatar.classList.add('avatar');
        
        const icon = document.createElement('i');
        if (sender === 'user') {
          icon.className = 'fa-solid fa-user';
        } else {
          icon.className = 'fa-solid fa-robot';
        }
        avatar.appendChild(icon);

        const bubble = document.createElement('div');
        bubble.classList.add('bubble');
        bubble.textContent = text;

        msgDiv.appendChild(avatar);
        msgDiv.appendChild(bubble);
        chatBox.appendChild(msgDiv);

        chatBox.scrollTop = chatBox.scrollHeight;
        return msgDiv;
      }

      function showTypingIndicator() {
        const typingDiv = document.createElement('div');
        typingDiv.classList.add('message', 'bot-message');
        typingDiv.id = 'typingIndicator';

        const avatar = document.createElement('div');
        avatar.classList.add('avatar');
        avatar.innerHTML = '<i class="fa-solid fa-robot"></i>';

        const bubble = document.createElement('div');
        bubble.classList.add('bubble', 'typing-indicator');
        bubble.innerHTML = '<span></span><span></span><span></span>';

        typingDiv.appendChild(avatar);
        typingDiv.appendChild(bubble);
        chatBox.appendChild(typingDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function removeTypingIndicator() {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();
      }

      chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const prompt = userInput.value.trim();
        if (!prompt) return;

        appendMessage('user', prompt);
        userInput.value = '';
        userInput.disabled = true;
        sendBtn.disabled = true;

        showTypingIndicator();

        try {
          const formattedPrompt = `User: ${prompt}\nVoltage:`;

          const response = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ prompt: formattedPrompt })
          });

          const data = await response.json();
          removeTypingIndicator();

          if (data.response) {
            appendMessage('bot', data.response);
          } else {
            appendMessage('bot', 'Sorry, I could not generate a response.');
          }
        } catch (err) {
          removeTypingIndicator();
          appendMessage('bot', 'Error connecting to the Voltage server.');
          console.error(err);
        } finally {
          userInput.disabled = false;
          sendBtn.disabled = false;
          userInput.focus();
        }
      });
    });
  </script>
</body>
</html>
